[project]
name = "rlt"
version = "0.1.0"
description = "Ranked-list truncation for product search on WANDS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.3.13",
    "numpy>=2.5.4",
    "pandas>=2.2",
    "pystemmer>=3.1.0",
    "sentence-transformers>=6.1.0",
]

[project.optional-dependencies]
cpu = ["torch>=2.14.1"]
cu130 = ["torch>=2.14.1"]

[dependency-groups]
dev = [
    "jupyter>=1.1",
    "matplotlib>=3.9",
    "ruff>=0.8",
]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
